      <label class="fld fld--dark"><span>{{t.form.name}}</span>
        <input name="name" autocomplete="name" required maxlength="60" data-letters>
        <em class="fld__err">{{t.form.errName}}</em>
      </label>
      <label class="fld fld--dark"><span>{{t.form.phone}}</span>
        <input name="phone" type="tel" inputmode="numeric" autocomplete="tel" placeholder="+998 (__) ___-__-__" required data-phone>
        <em class="fld__err">{{t.form.errPhone}}</em>
      </label>
