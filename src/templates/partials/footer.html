<footer class="ftr dark">
  <div class="wrap ftr__in">
    <div>
      <a href="{{homeLink}}" class="logo" aria-label="Li Auto">{{> logo}}</a>
      <p>{{t.footer.about}}</p>
    </div>
    <div class="ftr__col">
      <a href="tel:{{cfg.phoneRaw}}">{{cfg.phone}}</a>
      {{emailLink}}
      <span class="ftr__addr">{{mainAddress}}</span>
      <div class="soc">{{socialLinks}}</div>
    </div>
    <div class="ftr__col">
      {{footerModels}}
    </div>
  </div>
  <div class="wrap ftr__bottom">
    <p>© {{year}} {{dealerName}}. {{t.footer.rights}}</p>
    <p>{{t.footer.disclaimer}}</p>
    <p><a class="ftr__privacy" href="{{privacyLink}}">{{t.footer.privacy}}</a></p>
  </div>
</footer>

<div class="mbar">
  <a href="tel:{{cfg.phoneRaw}}" class="mbar__call" data-ev="call_mbar">{{t.bar.call}}</a>
  <a href="#lead" class="mbar__lead" data-book="" data-ev="cta_mbar">{{t.bar.lead}}</a>
</div>

{{> modal}}

<script type="application/json" id="site-data">{{siteJson}}</script>
<script src="{{base}}assets/js/main.js?v={{version}}" defer></script>
{{analyticsBody}}
</body>
</html>
