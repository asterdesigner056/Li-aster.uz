<section class="sec contacts" id="contacts">
  <div class="wrap">
    <header class="sec__head">
      <p class="eyebrow reveal">{{t.contacts.eyebrow}}</p>
      <h2 class="h2 reveal">{{t.contacts.title}}</h2>
    </header>
    <div class="contacts__in">
      <div class="dealers">
        {{#each dealers}}
        <article class="dealer reveal" data-dealer="{{id}}" data-map="{{mapSrc}}">
          <h3>{{dname}}</h3>
          <p class="dealer__addr">{{daddr}}</p>
          <p class="dealer__hours"><span>{{t.contacts.hours}}:</span> {{dhours}}</p>
          <a class="btn btn--dark dealer__call" href="tel:{{phoneRaw}}" data-ev="call_dealer">
            <svg viewBox="0 0 24 24"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg>
            {{phone}}
          </a>
          <div class="soc soc--dark">{{socialLinks}}</div>
          <div class="dealer__btns">
            <a class="btn btn--line btn--sm" target="_blank" rel="noopener" href="{{yandexMaps}}" data-ev="route_yandex">Yandex Maps</a>
            <a class="btn btn--line btn--sm" target="_blank" rel="noopener" href="{{googleMaps}}" data-ev="route_google">Google Maps</a>
          </div>
        </article>
        {{/each}}
      </div>
      <div class="map reveal" id="map"></div>
    </div>
  </div>
</section>
