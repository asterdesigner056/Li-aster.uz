; Ограничения PHP для этой папки (PHP-FPM / CGI — большинство хостингов).
; Снижают поверхность атаки PHP2Shell (CVE-2026-109618/109619), но НЕ заменяют обновление PHP.
session.upload_progress.enabled = 0
session.use_strict_mode = 1
display_errors = 0
display_startup_errors = 0
log_errors = 1
post_max_size = 16K
upload_max_filesize = 1K
max_input_vars = 40
max_input_nesting_level = 2
max_input_time = 10
max_execution_time = 20
memory_limit = 32M
